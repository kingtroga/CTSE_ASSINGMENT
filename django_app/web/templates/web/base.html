<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WMS - Sales Data Processor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f4ff',
                            100: '#e0e7ff',
                            500: '#667eea',
                            600: '#5a67d8',
                            700: '#4c51bf'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'spin-slow': 'spin 1s linear infinite'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for glassmorphism and special effects */
        .glass {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .gradient-btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }
        
        /* Animation keyframes */
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse-custom {
            animation: pulse-custom 2s infinite;
        }

        /* Mobile menu toggle styles */
        .mobile-menu-enter {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .mobile-menu-enter-active {
            max-height: 200px;
        }

        /* Prevent horizontal overflow */
        html, body {
            overflow-x: hidden;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Ensure all elements use border-box */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        /* Fix the main gradient background container */
        body.min-h-screen {
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        /* Fix the page content wrapper */
        .flex.items-center.justify-center {
            max-width: 100vw;
            overflow-x: hidden;
            padding: 1rem;
            box-sizing: border-box;
        }
        
        /* Ensure the white content container doesn't overflow */
        .bg-white.w-full {
            max-width: 100%;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        
        /* Fix any potential width issues with max-width containers */
        .max-w-4xl, .max-w-6xl, .max-w-7xl {
            max-width: calc(100vw - 2rem);
            box-sizing: border-box;
        }
        
        @media (min-width: 640px) {
            .max-w-4xl {
                max-width: 56rem;
            }
            .max-w-6xl {
                max-width: 72rem;
            }
            .max-w-7xl {
                max-width: 80rem;
            }
        }


        {% block extra_css %}{% endblock %}
    </style>
</head>
<body class="min-h-screen gradient-bg" style="overflow-x: hidden; max-width: 100vw;">
    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 glass border-b border-white/20 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="{% url 'web:process_sales_data' %}" 
                       class="text-xl font-bold text-gray-800 hover:text-primary-600 transition-colors duration-200">
                        🏪 WMS Portal
                    </a>
                </div>

                <!-- Desktop Navigation -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="{% url 'web:process_sales_data' %}" 
                           class="gradient-btn text-white px-4 py-2 rounded-full text-sm font-medium hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2">
                            📦 Order Fulfillment
                        </a>
                        <a href="{% url 'web:smart_assistant' %}" 
                           class="gradient-btn-secondary text-white px-4 py-2 rounded-full text-sm font-medium hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2">
                            🤖 Smart Assistant
                        </a>
                    </div>
                </div>


                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button type="button" 
                            class="bg-gray-200 inline-flex items-center justify-center p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500 transition-colors duration-200"
                            id="mobile-menu-button"
                            aria-controls="mobile-menu" 
                            aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <!-- Hamburger icon -->
                        <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <!-- Close icon (hidden by default) -->
                        <svg class="hidden h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div class="md:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 bg-white/90 backdrop-blur-sm border-t border-gray-200">
                <a href="{% url 'web:process_sales_data' %}" 
                    class="gradient-btn text-white block px-3 py-2 rounded-md text-base font-medium text-center transform hover:scale-105 transition-all duration-200">
                    📦 Order Fulfillment
                </a>
                <a href="{% url 'web:smart_assistant' %}" 
                    class="gradient-btn-secondary text-white block px-3 py-2 rounded-md text-base font-medium text-center transform hover:scale-105 transition-all duration-200">
                    🤖 Smart Assistant
                </a>
            </div>
        </div>

    <!-- Page Content -->
    <div class="flex items-center justify-center min-h-[calc(100vh-4rem)] p-4 sm:p-6 lg:p-8" style="max-width: 100vw; overflow-x: hidden;">
        <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl p-6 sm:p-8 lg:p-10" style="max-width: calc(100vw - 2rem); overflow-x: hidden;">
            {% block content %}
            <!-- Content goes here -->
            {% endblock %}
        </div>
    </div>

    {% block javascript %}
    <!-- Mobile menu toggle functionality -->
    <script>
        // Mobile menu toggle
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function() {
                    const isExpanded = mobileMenuButton.getAttribute('aria-expanded') === 'true';
                    
                    // Toggle aria-expanded
                    mobileMenuButton.setAttribute('aria-expanded', !isExpanded);
                    
                    // Toggle menu visibility
                    mobileMenu.classList.toggle('hidden');
                    
                    // Toggle icons
                    const hamburgerIcon = mobileMenuButton.querySelector('svg:first-child');
                    const closeIcon = mobileMenuButton.querySelector('svg:last-child');
                    
                    if (isExpanded) {
                        hamburgerIcon.classList.remove('hidden');
                        hamburgerIcon.classList.add('block');
                        closeIcon.classList.remove('block');
                        closeIcon.classList.add('hidden');
                    } else {
                        hamburgerIcon.classList.remove('block');
                        hamburgerIcon.classList.add('hidden');
                        closeIcon.classList.remove('hidden');
                        closeIcon.classList.add('block');
                    }
                });
            }
        });

        // Utility functions available to all templates
        function showLoading(show, buttonId = 'process-btn') {
            const loadingDiv = document.getElementById('loading');
            const button = document.getElementById(buttonId);
            
            if (loadingDiv) {
                loadingDiv.classList.toggle('hidden', !show);
            }
            if (button) {
                button.disabled = show;
                if (show) {
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                } else {
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            }
        }

        function showError(message, elementId = 'error-message') {
            const errorDiv = document.getElementById(elementId);
            const successDiv = document.getElementById('success-message');
            const warningDiv = document.getElementById('warning-message');
            
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            }
            if (successDiv) successDiv.classList.add('hidden');
            if (warningDiv) warningDiv.classList.add('hidden');
        }

        function showSuccess(message, elementId = 'success-message') {
            const successDiv = document.getElementById(elementId);
            const errorDiv = document.getElementById('error-message');
            const warningDiv = document.getElementById('warning-message');
            
            if (successDiv) {
                successDiv.textContent = message;
                successDiv.classList.remove('hidden');
            }
            if (errorDiv) errorDiv.classList.add('hidden');
            if (warningDiv) warningDiv.classList.add('hidden');
        }

        function showWarning(message, elementId = 'warning-message') {
            const warningDiv = document.getElementById(elementId);
            if (warningDiv) {
                warningDiv.innerHTML = `<strong class="block mb-1">⚠️ Important:</strong> ${message}`;
                warningDiv.classList.remove('hidden');
            }
        }

        function hideMessages() {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const warningDiv = document.getElementById('warning-message');
            
            if (errorDiv) errorDiv.classList.add('hidden');
            if (successDiv) successDiv.classList.add('hidden');
            if (warningDiv) warningDiv.classList.add('hidden');
        }

        // Common CSRF token helper
        function getCSRFToken() {
            const csrfTokenElement = document.querySelector('[name=csrfmiddlewaretoken]');
            return csrfTokenElement ? csrfTokenElement.value : null;
        }

        // Common fetch helper with CSRF token
        async function fetchWithCSRF(url, options = {}) {
            const csrfToken = getCSRFToken();
            if (csrfToken && options.method !== 'GET') {
                if (options.body instanceof FormData) {
                    options.body.append('csrfmiddlewaretoken', csrfToken);
                } else {
                    options.headers = {
                        ...options.headers,
                        'X-CSRFToken': csrfToken
                    };
                }
            }
            return fetch(url, options);
        }

        // Updated toggle log viewer function for collapsible logs
        function toggleLogViewer() {
            const logContent = document.getElementById('log-content');
            const toggleBtn = document.getElementById('toggle-logs-btn');
            
            const isCollapsed = logContent.classList.contains('hidden');
            
            if (isCollapsed) {
                // Expand the logs
                logContent.classList.remove('hidden');
                toggleBtn.textContent = 'Hide Logs';
                // Auto-scroll to bottom when expanding
                logContent.scrollTop = logContent.scrollHeight;
            } else {
                // Collapse the logs (hide content but keep header visible)
                logContent.classList.add('hidden');
                toggleBtn.textContent = 'Show Logs';
            }
        }
    </script>
    {% endblock %}
</body>
</html>
