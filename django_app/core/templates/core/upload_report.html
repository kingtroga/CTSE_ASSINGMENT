<!DOCTYPE html>
<html>
<head>
    <title>WMS Report Upload</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .upload-area { 
            border: 2px dashed #ccc; 
            padding: 40px; 
            text-align: center; 
            margin: 20px 0; 
            border-radius: 8px;
        }
        .upload-area.dragover { border-color: #007cba; background: #f0f8ff; }
        .btn { 
            background: #007cba; 
            color: white; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            margin: 10px;
        }
        .btn:hover { background: #005a87; }
        .results { margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>WMS Daily Report Upload</h1>
    
    <!-- Baserow Sync Controls -->
    <div style="background: #e7f3ff; padding: 15px; margin-bottom: 20px; border-radius: 4px;">
        <h3>Baserow Sync</h3>
        <button class="btn" onclick="syncBaserow('push')">Push to Baserow</button>
        <button class="btn" onclick="syncBaserow('pull')">Pull from Baserow</button>
        <button class="btn" onclick="syncBaserow('full')">Full Sync</button>
        <div id="syncResults"></div>
    </div>
    
    <!-- File Upload -->
    <form id="uploadForm" enctype="multipart/form-data">
        <div>
            <label>Marketplace:</label>
            <select name="marketplace" required>
                <option value="CSTE_AMAZON">CSTE Amazon</option>
                <option value="CSTE_FK">CSTE Flipkart</option>
                <option value="CSTE_MEESHO">CSTE Meesho</option>
                <option value="GL_FK">GL Flipkart</option>
                <option value="RUDRAV_MEESHO">Rudrav Meesho</option>
                <option value="MISC">Miscellaneous</option>
            </select>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <p>Drag and drop your CSV/Excel file here, or click to select</p>
            <input type="file" name="report_file" id="fileInput" accept=".csv,.xlsx" style="display: none;" required>
            <button type="button" class="btn" onclick="document.getElementById('fileInput').click()">
                Select File
            </button>
        </div>
        
        <button type="submit" class="btn">Process Report</button>
    </form>
    
    <div id="results" class="results" style="display: none;"></div>
    
    <script>
        // Drag and drop functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        });
        
        fileInput.addEventListener('change', updateFileName);
        
        function updateFileName() {
            if (fileInput.files.length > 0) {
                uploadArea.innerHTML = `<p>Selected: ${fileInput.files[0].name}</p>`;
            }
        }
        
        // Form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = '<p>Processing...</p>';
            resultsDiv.style.display = 'block';
            
            try {
                const response = await fetch('', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `
                        <h3 class="success">✅ Processing Complete</h3>
                        <p><strong>Total Processed:</strong> ${data.total_processed}</p>
                        <p><strong>Unmapped SKUs:</strong> ${data.total_unmapped}</p>
                        ${data.unmapped_skus.length > 0 ? 
                            `<details><summary>Unmapped SKUs (click to expand)</summary>
                             <pre>${data.unmapped_skus.join('\\n')}</pre></details>` : ''}
                        <details><summary>Outbound Data (click to expand)</summary>
                         <pre>${JSON.stringify(data.outbound_data.slice(0, 10), null, 2)}</pre>
                         ${data.outbound_data.length > 10 ? `<p>... and ${data.outbound_data.length - 10} more records</p>` : ''}
                        </details>
                    `;
                } else {
                    resultsDiv.innerHTML = `<h3 class="error">❌ Error: ${data.error}</h3>`;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<h3 class="error">❌ Network Error: ${error.message}</h3>`;
            }
        });
        
        // Baserow sync functions
        async function syncBaserow(type) {
            const resultsDiv = document.getElementById('syncResults');
            resultsDiv.innerHTML = `<p>Syncing with Baserow (${type})...</p>`;
            
            try {
                const response = await fetch(`/sync-baserow/?type=${type}`);
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `<p class="success">✅ Baserow sync (${type}) completed successfully</p>`;
                } else {
                    resultsDiv.innerHTML = `<p class="error">❌ Baserow sync failed: ${data.error}</p>`;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<p class="error">❌ Sync error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
